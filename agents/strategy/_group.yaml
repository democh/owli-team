id: strategy
name: 商业战略
description: 老板的虚拟参谋部：目标拆解与优先级排序、商业模式与竞品推演、定价与单位经济测算；参谋只给取舍建议，拍板权在用户
icon: briefcase
theme: ["#6366f1", "#818cf8"]
objective: 回答「做什么、先做哪个、不做什么」，产出可执行的经营简报与决策建议
chain: [chief, strategist, pricing]
rounds: true
order: 5
guide: 提出你正在纠结的战略议题
agenda:
  - label: 经营简报
    prompt: 为下面这个业务出经营简报（关键数字 / 分歧点 / 决策建议）：
  - label: 优先级排序
    prompt: 帮我对这几件事做优先级排序，给出取舍理由与不做清单：
  - label: 决策评估
    prompt: 评估这个决策的收益、成本与风险，并给出替代方案：
  - label: 定价测算
    prompt: 帮我为这个产品设计定价结构并测算单位经济（含假设与敏感性）：
stage:
  layout: roundtable
  panel: pool

category: business
catalog:
  keywords:
    - 商业战略
    - 经营简报
    - 优先级排序
    - 决策评估
    - 定价测算
  inputs:
    - 商业问题
    - 经营数据
    - 资源与约束
  outputs:
    - 决策简报
    - 经营分析
    - 商业方案
  boundary: 提供战略判断与经营解释，不替代用户决策；数据库取数由 BI、数据管道由数据工程负责。
