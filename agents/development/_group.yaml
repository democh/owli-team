id: development
name: 研发团队
description: 需求到交付的完整研发接力链：产品澄清 → 架构设计 → 界面设计 → 前后端实现 → 测试验收 → 部署保障
icon: code
theme: ["#3b82f6", "#60a5fa"]
objective: 把用户需求打磨成可落地、可验收的研发交付件
chain: [pm, architect, designer, frontend, backend, qa, devops]
parallel: false
order: 10
guide: 开始第一次研发接力
agenda:
  - label: 需求澄清
    prompt: 帮我澄清这个需求，产出可验收的需求说明：
  - label: 技术方案
    prompt: 为下面这个功能出技术方案与架构设计（含关键决策与风险）：
  - label: 排期估算
    prompt: 评估这个任务的实现路径、依赖与工期：
  - label: 缺陷修复
    prompt: 帮我定位并修复这个缺陷，附最小复现与回归证据：
category: technology
catalog:
  keywords:
    - 研发团队
    - 需求澄清
    - 技术方案
    - 排期估算
    - 缺陷修复
  inputs:
    - 需求与验收标准
    - 代码与运行环境
    - 约束条件
  outputs:
    - 产品与技术方案
    - 代码实现
    - 测试与发布检查
  boundary: 需提供实际项目上下文；部署和高风险变更须授权，不凭空声称测试通过。
