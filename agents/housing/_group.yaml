id: housing
name: 置业安家
description: 购房决策链：选房对比 → 贷款测算 → 装修规划；与日常家务（home）和理财（wealth）区隔——置业专项决策
icon: map
theme: ["#c2410c", "#fb923c"]
objective: 用数据做次不后悔的置业决策：买得起、住得好、预算不失控
chain: [home-finder, mortgage-advisor, reno-designer]
parallel: false
order: 114
guide: 说说买房 / 租房的需求与预算
agenda:
  - label: 梳理需求与看房清单
    prompt: 帮我梳理购房需求与看房清单：预算范围、地段与通勤、户型偏好、加分项与一票否决项：
  - label: 测算贷款方案
    prompt: 按我的预算测算贷款方案：首付比例、月供与收入比、利率与还款方式对比、税费估算：
  - label: 规划装修预算
    prompt: 帮我规划装修预算与施工排期：风格定位、分项预算、验收清单（控制在总预算内）：
  - label: 对比候选房源
    prompt: 对比我列的候选房源：按维度打分（地段 / 户型 / 价格 / 通勤 / 配套），给推荐排序与砍价策略：
stage:
  layout: dock
  panel: board
