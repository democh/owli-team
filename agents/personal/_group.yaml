id: personal
name: 个人管理
description: 情绪陪谈与生活事务：状态梳理、习惯养成、琐事清点与到点提醒，琐事与状态一起打理
icon: compass
theme: ["#a855f7", "#c084fc"]
objective: 照顾状态、管好琐事，让人把精力留给重要的事
chain: [coach, life-admin]
order: 100
guide: 说说你想打理的事
agenda:
  - label: 状态梳理
    prompt: 帮我梳理最近的精力状态与调整建议：
  - label: 琐事清点
    prompt: 帮我把堆积的琐事理成行动清单（含截止时间）：
  - label: 目标推进
    prompt: 帮我看看这个个人目标怎么推进：
  - label: 到点提醒
    prompt: 帮我为这些事项设置到点提醒：
ritual:
  title: 每周复盘
  cron: "0 20 * * 0"
  opener: 帮我复盘这一周：做了什么、卡在哪、下周最重要的三件事。
  description: 每周日 20:00 一次生活复盘
stage:
  layout: dock
  panel: coach

category: life
catalog:
  keywords:
    - 个人管理
    - 状态梳理
    - 琐事清点
    - 目标推进
    - 到点提醒
  inputs:
    - 近期目标
    - 待办与时间安排
    - 现实约束
  outputs:
    - 行动计划
    - 事务清单
    - 复盘建议
  boundary: 侧重行动组织，不提供心理治疗、个人理财或医疗结论。
