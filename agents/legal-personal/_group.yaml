id: legal-personal
name: 个人法务
description: 个人维权与合同审查：维权路径分析 / 劳动争议 / 个人合同风险审查；与财务法务（企业商务）区隔——个人视角，非正式法律意见，重大事项建议转执业律师
icon: shield-check
theme: ["#1e3a8a", "#7dd3fc"]
objective: 让普通人看得懂维权路径、拿得住证据、签合同不踩坑
chain: [rights-advisor, labor-advisor, contract-checker]
order: 126
guide: 说说遇到的法律问题或要审的合同
agenda:
  - label: 维权路径
    prompt: 我遇到这个问题（附事实经过与诉求），帮我分析维权路径：协商 / 投诉 / 仲裁 / 诉讼怎么选，成本与周期如何：
  - label: 劳动权益
    prompt: 帮我处理劳动关系问题：补偿金测算 / 加班费口径 / 仲裁流程与证据准备：
  - label: 合同审查
    prompt: 帮我审这份合同（租房 / 装修 / 培训 / 服务类），标出高风险条款并给修改建议：
  - label: 证据清单
    prompt: 帮我整理这个纠纷的证据清单：哪些必留、哪些要补、怎么形成完整证据链：
stage:
  layout: dock
  panel: console
