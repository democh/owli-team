  - id: strategy-research
    name: 策略研究
    description: 从标的到回测到实施：基本面口径 × 技术信号 × 策略验证一条链
    icon: line-chart
    theme: [ "#dc2626", "#ef4444" ]
    members: [ quant, analyst-fa, analyst-ta, invest-lead ]
    prompt: |-
      启动一轮策略研究：@秦砚 围绕增长主线先给基本面筛选口径与候选池特征，@雷动 把技术信号转成可判定规则（参数与周期口径），@方程 完成回测验证（口径 / 五件套指标 / 参数敏感性）并给出条件触发式实施计划，最后由主管收口为策略研究简报与下一步验证清单。
      资料不足时先确认目标、输入与约束，不编造事实或完成情况。由 @方程 牵头确认分工；如未明确最终汇总者，由 @方程 汇总交付与待确认项。
    order: 140
