# agents/_presets.yaml —— 快速组队预设（可选文件；缺失时建会话对话框自动隐藏该区块）
#
# 规范（详见 agents/README.md）：
# - id 全局唯一；members 必须为已存在角色 id（可跨场景）；order 越小越靠前；
# - prompt 为建会话后预填到输入框（Composer 草稿）的开场指令模板，可直接编辑发送；
# - 修改后经 mtime 热更新即时生效（无需重启）；`npm run check:agents` 校验成员存在性。
presets:
  - id: weekly-review
    name: 周经营例会
    description: 财务、增长与经营指标复盘，由幕僚长汇总简报与下周优先级
    icon: calendar-clock
    theme: [ "#6366f1", "#818cf8" ]
    members: [ chief, finance, growth, insight ]
    prompt: |-
      主持本周经营例会：请 @周正 先给出财务测算（收入 / 成本 / 现金流口径），@高扬 汇报增长指标与实验结论，@甄明 解释经营指标波动、归因与数据局限，最后由 @柏川 收敛为经营简报与下周优先级。
      资料不足时先确认目标、输入与约束，不编造事实或完成情况。由 @柏川 牵头确认分工；如未明确最终汇总者，由 @柏川 汇总交付与待确认项。
    order: 10
    category: business
    catalog:
      keywords:
        - 周经营例会
        - 幕僚长
        - 财务管家
        - 增长负责人
        - 经营分析师
      inputs:
        - 商业问题
        - 经营数据
        - 资源与约束
        - 账目与凭证
        - 主体与地区
      outputs:
        - 经营简报
        - 下周优先级
      boundary: 提供战略判断与经营解释，不替代用户决策；数据库取数由 BI、数据管道由数据工程负责。

  - id: content-campaign
    name: 内容营销战役
    description: 一轮完整内容战役：目标拆解 → 选题日历 → 搜索投放 → 品牌物料
    icon: sparkles
    theme: [ "#f43f5e", "#fb7185" ]
    members: [ growth, content, seo, brand ]
    prompt: |-
      发起一轮内容营销战役：@高扬 先拆解目标与 KPI 口径，@林悦 产出选题与发布日历，@韩枫 给出关键词词表与投放建议，@云舒 补齐品牌物料规范，最终汇总为战役方案与内容日历。
      资料不足时先确认目标、输入与约束，不编造事实或完成情况。由 @高扬 牵头确认分工；如未明确最终汇总者，由 @高扬 汇总交付与待确认项。
    order: 20
    category: business
    catalog:
      keywords:
        - 内容营销战役
        - 增长负责人
        - 内容策划
        - 搜索投放
        - 品牌视觉
      inputs:
        - 产品与客群
        - 渠道数据
        - 预算与目标
      outputs:
        - 内容战役方案
        - 发布日历
      boundary: 面向企业获客，不承诺排名或转化收益；预算与发布由用户确认。

  - id: product-launch
    name: 产品发布冲刺
    description: 研发 × 市场联动：发布范围、上线检查单与内容准备
    icon: rocket
    theme: [ "#3b82f6", "#60a5fa" ]
    members: [ pm, growth, content, devops ]
    prompt: |-
      规划一次产品发布冲刺：@费利 给出发布范围与验收清单，@高扬 制定上线后的增长动作，@林悦 准备发布内容包，@奥托 输出上线检查单与回滚预案。
      资料不足时先确认目标、输入与约束，不编造事实或完成情况。由 @费利 牵头确认分工；如未明确最终汇总者，由 @费利 汇总交付与待确认项。
    order: 30
    category: technology
    catalog:
      keywords:
        - 产品发布冲刺
        - 产品经理
        - 增长负责人
        - 内容策划
        - DevOps 工程师
