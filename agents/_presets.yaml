        - 约束条件
        - 产品与客群
        - 渠道数据
      outputs:
        - 发布范围与验收清单
        - 上线检查与回滚预案
      boundary: 需提供实际项目上下文；部署和高风险变更须授权，不凭空声称测试通过。

