        - 策略研究
        - 量化策略师
        - 基本面分析师
        - 技术面分析师
        - 投研主管
      inputs:
        - 标的与研究问题
        - 周期与数据
        - 风险约束
      outputs:
        - 策略研究简报
        - 回测与验证清单
      boundary: 投资研究参考，不构成投资建议；不保证收益、不代客交易。

  - id: bull-bear-duel
    name: 投研观点交锋
    description: 多方与空方逐轮对抗：证据交锋 × 量化走子，主管终局裁决
    icon: scale
    theme: [ "#dc2626", "#ef4444" ]
    members: [ invest-lead, analyst-fa, analyst-ta, analyst-news, quant ]
