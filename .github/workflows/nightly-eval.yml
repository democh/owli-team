name: Nightly Eval

# P3 评测闭环（style-and-prompt-optimization §P3）：夜间 mock 基线回归 +
# （可选）真实模型 judge 基线——配置仓库 Secret `LLM_API_KEY` 后 judge 步骤自动启用，
# 未配置时自动跳过（仅跑 mock 基线，零外部依赖）。
#
# 手动触发：Actions → Nightly Eval → Run workflow。
# 如需自定义端点 / 模型，在本 job 的 env 补 LLM_BASE_URL / LLM_MODEL / JUDGE_MODEL。

on:
  schedule:
    # 每日 18:00 UTC（北京时间约次日 02:00）
    - cron: '0 18 * * *'
  workflow_dispatch:

concurrency:
  group: nightly-eval
  cancel-in-progress: false

jobs:
  eval:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      LLM_API_KEY: ${{ secrets.LLM_API_KEY }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: npm

      - name: Install
        run: npm ci

      - name: Mock 基线回归（确定性门禁）
        run: npm run eval

      - name: 真实模型 judge 基线（可选；未配置 LLM_API_KEY 时跳过）
        if: env.LLM_API_KEY != ''
        run: npm run eval -- --judge

      - name: 报告归档（评测产物留档 14 天）
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: nightly-eval-report
          path: evals/reports/
          retention-days: 14
