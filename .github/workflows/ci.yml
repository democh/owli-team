name: CI

on:
  push:
    branches: [main]
  pull_request:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4

      # node:sqlite（内置驱动）需要 Node 22.13+；与本地开发环境保持一致
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: npm

      - name: Install
        run: npm ci

      - name: Typecheck
        run: npm run typecheck

      - name: Lint
        run: npm run lint

      - name: Test（server + client，mock 模式，无外部依赖；含覆盖率门禁）
        run: npm run test:coverage

      - name: Build client + 首屏体积预算
        run: npm run build -w @multi-agent/client && npm run check:bundle

      - name: Eval（mock 确定性断言 + 基线回归门禁）
        run: npm run eval

  e2e:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: npm

      - name: Install
        run: npm ci

      - name: Install Playwright Chromium
        run: npx playwright install --with-deps chromium

      - name: E2E（Playwright，LLM_MOCK 确定性模式）
        run: npm run e2e

      - name: Upload Playwright report
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-report
          path: |
            playwright-report/
            test-results/
          retention-days: 7

  agents:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: npm
      - run: npm ci
      - name: Agent 包 / Skill 资产校验（含专家级质量 strict 门禁）
        run: |
          QUALITY_STRICT=1 npm run check:agents
          SKILL_STRICT=1 npm run check:skills
